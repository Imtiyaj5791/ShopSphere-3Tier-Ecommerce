apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: image: 008826676494.dkr.ecr.ap-south-1.amazonaws.com/shopsphere-frontend:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 80
